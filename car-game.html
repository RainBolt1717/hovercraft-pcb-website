<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Road Rush</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #111;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  #ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #score-box {
    background: rgba(0,0,0,0.55);
    border-radius: 12px;
    padding: 6px 14px;
    text-align: center;
  }
  #score-label { color: #aaa; font: 600 11px/1 'Arial', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  #score-val { color: #fff; font: 700 26px/1.2 'Arial', sans-serif; }
  #speed-box {
    background: rgba(0,0,0,0.55);
    border-radius: 12px;
    padding: 6px 14px;
    text-align: center;
  }
  #speed-label { color: #aaa; font: 600 11px/1 'Arial', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  #speed-val { color: #4cf; font: 700 26px/1.2 'Arial', sans-serif; }
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 24px 28px 0;
    pointer-events: all;
  }
  #accel-zone {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    pointer-events: all;
  }
  #horn-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe066, #c8900a);
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    pointer-events: all;
    transition: transform 0.08s, box-shadow 0.08s;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }
  #horn-btn:active, #horn-btn.pressed {
    transform: scale(0.92);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #horn-icon { font-size: 28px; line-height: 1; }
  #horn-label { color: rgba(80,40,0,0.85); font: 700 9px/1 'Arial', sans-serif; letter-spacing: 1px; margin-top: 2px; }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    z-index: 20;
  }
  #overlay h1 { color: #fff; font: 800 40px/1 'Arial', sans-serif; letter-spacing: 2px; margin-bottom: 8px; }
  #overlay .subtitle { color: #4cf; font: 600 14px/1.4 'Arial', sans-serif; margin-bottom: 36px; text-align: center; padding: 0 30px; }
  #overlay .final-score { color: #ffe066; font: 700 22px/1 'Arial', sans-serif; margin-bottom: 32px; }
  #start-btn {
    background: linear-gradient(135deg, #4cf, #07a);
    color: #fff;
    border: none;
    border-radius: 50px;
    font: 700 18px/1 'Arial', sans-serif;
    letter-spacing: 1px;
    padding: 16px 48px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,180,255,0.4);
    pointer-events: all;
  }
  #instructions {
    color: #888;
    font: 400 12px/1.8 'Arial', sans-serif;
    margin-top: 28px;
    text-align: center;
    padding: 0 30px;
  }
  #instructions span { color: #bbb; }
  #accel-indicator {
    position: absolute;
    bottom: 165px; left: 50%;
    transform: translateX(-50%);
    background: rgba(76,204,255,0.18);
    border: 1.5px solid rgba(76,204,255,0.4);
    border-radius: 20px;
    padding: 5px 18px;
    color: #4cf;
    font: 600 12px/1 'Arial', sans-serif;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #accel-indicator.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score-box">
    <div id="score-label">SCORE</div>
    <div id="score-val">0</div>
  </div>
  <div id="speed-box">
    <div id="speed-label">km/h</div>
    <div id="speed-val">0</div>
  </div>
</div>
<div id="accel-indicator">HOLD TO ACCELERATE</div>
<div id="controls">
  <div id="accel-zone"></div>
  <div id="horn-btn">
    <div id="horn-icon">📯</div>
    <div id="horn-label">HORN</div>
  </div>
</div>
<div id="overlay">
  <h1>ROAD RUSH</h1>
  <div class="subtitle">Dodge traffic and survive as long as you can!</div>
  <div class="final-score" id="final-score" style="display:none"></div>
  <button id="start-btn">TAP TO START</button>
  <div id="instructions">
    <span>Hold bottom of screen</span> to accelerate<br>
    <span>Drag left/right</span> to steer<br>
    <span>Horn button</span> to nudge cars aside
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const scoreVal = document.getElementById('score-val');
const speedVal = document.getElementById('speed-val');
const finalScore = document.getElementById('final-score');
const hornBtn = document.getElementById('horn-btn');
const accelIndicator = document.getElementById('accel-indicator');

// ─── Resize ───────────────────────────────────────────────
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Road geometry ────────────────────────────────────────
const LANES = 4;
function roadLeft()  { return canvas.width * 0.05; }
function roadRight() { return canvas.width * 0.95; }
function roadWidth() { return roadRight() - roadLeft(); }
function laneWidth() { return roadWidth() / LANES; }
function laneX(i)    { return roadLeft() + laneWidth() * i + laneWidth() * 0.5; }

// ─── Game state ───────────────────────────────────────────
let state = 'menu'; // 'menu' | 'playing' | 'dead'
let score = 0;
let highScore = 0;
let raf;

// Player
const player = {
  x: 0, y: 0,
  w: 0, h: 0,
  vx: 0,
  speed: 0,       // current forward speed (px/s road scroll speed equivalent)
  maxSpeed: 520,
  accel: 200,
  decel: 280,
  steerSpeed: 380,
  alive: true,
};

// Traffic cars
let trafficCars = [];
// Road markings
let dashes = [];
// Particles for collision
let particles = [];
// Roadside trees/poles
let scenery = [];

// Touch state
const touch = {
  active: false,
  startX: 0,
  startY: 0,
  currentX: 0,
  currentY: 0,
  id: null,
};
let hornActive = false;
let hornCooldown = 0;
const HORN_COOLDOWN = 2.8; // seconds between honks

// ─── Car color palettes ───────────────────────────────────
const carColors = [
  ['#e74c3c','#c0392b'], ['#3498db','#2980b9'], ['#2ecc71','#27ae60'],
  ['#f39c12','#d68910'], ['#9b59b6','#8e44ad'], ['#1abc9c','#16a085'],
  ['#e67e22','#d35400'], ['#ecf0f1','#bdc3c7'], ['#34495e','#2c3e50'],
  ['#e91e63','#c2185b'],
];

// ─── Init game ────────────────────────────────────────────
function initGame() {
  score = 0;
  player.x = canvas.width / 2;
  player.y = canvas.height * 0.78;
  player.w = laneWidth() * 0.52;
  player.h = player.w * 1.9;
  player.vx = 0;
  player.speed = 0;
  player.alive = true;
  trafficCars = [];
  particles = [];
  dashes = [];
  scenery = [];
  hornCooldown = 0;

  // Seed road dashes
  for (let i = 0; i < 20; i++) {
    dashes.push({
      lane: Math.floor(Math.random() * (LANES - 1)),
      y: Math.random() * canvas.height,
    });
  }
  // Seed scenery
  for (let i = 0; i < 8; i++) {
    scenery.push(makeScenery(Math.random() * canvas.height));
  }
  // Spawn some traffic immediately
  for (let i = 0; i < 3; i++) {
    spawnTraffic(Math.random() * canvas.height * 0.5);
  }
}

// ─── Scenery factory ──────────────────────────────────────
function makeScenery(y) {
  const side = Math.random() < 0.5 ? 'left' : 'right';
  const x = side === 'left'
    ? roadLeft() * 0.5 * Math.random()
    : roadRight() + (canvas.width - roadRight()) * 0.5 * Math.random();
  return { x, y, side, type: Math.random() < 0.6 ? 'tree' : 'pole' };
}

// ─── Traffic spawn ────────────────────────────────────────
let spawnTimer = 0;
function spawnTraffic(y) {
  const lane = Math.floor(Math.random() * LANES);
  const color = carColors[Math.floor(Math.random() * carColors.length)];
  const w = laneWidth() * 0.52;
  const h = w * 1.8;
  trafficCars.push({
    x: laneX(lane),
    y: y !== undefined ? y : -h - Math.random() * 100,
    targetX: laneX(lane),
    lane,
    w, h,
    color,
    speed: 60 + Math.random() * 80, // traffic base speed
    avoiding: false,
    avoidDir: 0,
    avoidTimer: 0,
    hornNudge: 0,        // lateral nudge from horn
    hornNudgeTimer: 0,
  });
}

// ─── Horn effect ──────────────────────────────────────────
function triggerHorn() {
  if (hornCooldown > 0) return;
  hornCooldown = HORN_COOLDOWN;
  hornBtn.classList.add('pressed');
  setTimeout(() => hornBtn.classList.remove('pressed'), 180);

  // Nudge nearby cars ahead of player
  const range = canvas.height * 0.45;
  for (const car of trafficCars) {
    const dy = player.y - car.y; // positive = car is above player (ahead)
    if (dy > 0 && dy < range) {
      const proximity = 1 - dy / range; // closer = more effect
      // Determine which way to nudge: pick the lane with space
      const nudgeDir = car.lane < LANES / 2 ? 1 : -1;
      car.hornNudge = nudgeDir * laneWidth() * (0.6 + proximity * 0.5);
      car.hornNudgeTimer = 1.2 + proximity * 0.8; // slow drift
      car.avoiding = true;
      car.avoidTimer = car.hornNudgeTimer;
    }
  }

  // Play horn sound via AudioContext
  playHorn();
}

// ─── Audio ────────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playHorn() {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(280, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(320, ac.currentTime + 0.12);
    osc.frequency.linearRampToValueAtTime(290, ac.currentTime + 0.35);
    gain.gain.setValueAtTime(0.22, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.5);
  } catch(e) {}
}
function playCollision() {
  try {
    const ac = getAudio();
    const buf = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.08));
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gain = ac.createGain();
    gain.gain.value = 0.5;
    src.connect(gain); gain.connect(ac.destination);
    src.start();
  } catch(e) {}
}
function playEngine(speed) {
  // Just visual feedback; continuous engine sound would need ScriptProcessor
}

// ─── Particles ────────────────────────────────────────────
function spawnParticles(x, y) {
  for (let i = 0; i < 22; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 80 + Math.random() * 260;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r: 3 + Math.random() * 6,
      life: 1,
      color: ['#ff4444','#ff8800','#ffcc00','#ffffff'][Math.floor(Math.random()*4)],
    });
  }
}

// ─── Collision ────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw/2 < bx + bw/2 &&
         ax + aw/2 > bx - bw/2 &&
         ay - ah/2 < by + bh/2 &&
         ay + ah/2 > by - bh/2;
}

// ─── Draw helpers ─────────────────────────────────────────
function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCar(ctx, x, y, w, h, colors, isPlayer, speed) {
  const [body, dark] = colors;
  const lx = x - w/2, ty = y - h/2;

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + h/2 - 4, w * 0.45, h * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = body;
  drawRoundRect(ctx, lx, ty, w, h, w * 0.22);
  ctx.fill();

  // Roof (darker top section)
  ctx.fillStyle = dark;
  const roofW = w * 0.72, roofH = h * 0.38;
  drawRoundRect(ctx, x - roofW/2, ty + h * 0.2, roofW, roofH, roofW * 0.18);
  ctx.fill();

  // Windshield
  ctx.fillStyle = isPlayer ? 'rgba(160,230,255,0.75)' : 'rgba(140,200,255,0.65)';
  const wsW = roofW * 0.78, wsH = roofH * 0.6;
  drawRoundRect(ctx, x - wsW/2, ty + h * 0.22, wsW, wsH, 4);
  ctx.fill();

  // Rear window
  ctx.fillStyle = 'rgba(140,200,255,0.5)';
  const rwH = roofH * 0.48;
  drawRoundRect(ctx, x - wsW/2, ty + h * 0.2 + roofH - rwH - 2, wsW, rwH, 4);
  ctx.fill();

  // Wheels
  const ww = w * 0.22, wh = h * 0.18;
  const wheelPairs = [
    [lx - ww*0.3, ty + h * 0.14],
    [lx + w - ww*0.7, ty + h * 0.14],
    [lx - ww*0.3, ty + h * 0.68],
    [lx + w - ww*0.7, ty + h * 0.68],
  ];
  for (const [wx, wy] of wheelPairs) {
    ctx.fillStyle = '#222';
    drawRoundRect(ctx, wx, wy, ww, wh, 3);
    ctx.fill();
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.ellipse(wx + ww/2, wy + wh/2, ww*0.32, wh*0.32, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Headlights / taillights
  if (isPlayer) {
    // Taillights (back of player car is bottom)
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;
    ctx.fillRect(lx + w*0.08, ty + h - 8, w*0.22, 5);
    ctx.fillRect(lx + w*0.7, ty + h - 8, w*0.22, 5);
    ctx.shadowBlur = 0;
    // Headlights
    ctx.fillStyle = '#ffffc0';
    ctx.shadowColor = '#ffff80'; ctx.shadowBlur = 10;
    ctx.fillRect(lx + w*0.08, ty + 4, w*0.22, 5);
    ctx.fillRect(lx + w*0.7, ty + 4, w*0.22, 5);
    ctx.shadowBlur = 0;
  } else {
    // Taillights face player
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 8;
    ctx.fillRect(lx + w*0.08, ty + h - 8, w*0.22, 5);
    ctx.fillRect(lx + w*0.7, ty + h - 8, w*0.22, 5);
    ctx.shadowBlur = 0;
  }

  // Horn effect shimmer on player
  if (isPlayer && hornCooldown > HORN_COOLDOWN - 0.25) {
    const alpha = (hornCooldown - (HORN_COOLDOWN - 0.25)) / 0.25;
    ctx.save();
    ctx.globalAlpha = alpha * 0.35;
    ctx.fillStyle = '#ffe066';
    drawRoundRect(ctx, lx - 4, ty - 4, w + 8, h + 8, w * 0.26);
    ctx.fill();
    ctx.restore();
  }
}

function drawTree(ctx, x, y) {
  ctx.fillStyle = '#4a3728';
  ctx.fillRect(x - 4, y - 14, 8, 22);
  ctx.fillStyle = '#2d6a2d';
  ctx.beginPath();
  ctx.arc(x, y - 22, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3a8a3a';
  ctx.beginPath();
  ctx.arc(x - 3, y - 26, 10, 0, Math.PI * 2);
  ctx.fill();
}

function drawPole(ctx, x, y) {
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x, y - 36);
  ctx.stroke();
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(x, y - 38, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(x, y - 38, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ─── Main update ──────────────────────────────────────────
let lastTime = 0;
function update(dt) {
  if (!player.alive) return;

  const W = canvas.width, H = canvas.height;
  const rl = roadLeft(), rr = roadRight();

  // Speed
  const accelHeld = touch.active;
  if (accelHeld) {
    player.speed = Math.min(player.speed + player.accel * dt, player.maxSpeed);
  } else {
    player.speed = Math.max(player.speed - player.decel * dt, 0);
  }

  // Steering: map drag delta to velocity
  if (touch.active) {
    const dragX = touch.currentX - touch.startX;
    // Clamp drag to ±half road width for max steer
    const maxDrag = 80;
    const steerFraction = Math.max(-1, Math.min(1, dragX / maxDrag));
    const targetVx = steerFraction * player.steerSpeed;
    // Lerp toward target steer velocity for feel
    player.vx += (targetVx - player.vx) * Math.min(1, dt * 8);
  } else {
    player.vx *= Math.pow(0.05, dt); // snap to zero when not touching
  }

  player.x += player.vx * dt;
  // Clamp to road
  const hw = player.w / 2;
  player.x = Math.max(rl + hw, Math.min(rr - hw, player.x));

  // Horn cooldown
  if (hornCooldown > 0) hornCooldown = Math.max(0, hornCooldown - dt);

  // Score increases with speed
  score += player.speed * dt * 0.04;
  scoreVal.textContent = Math.floor(score);
  speedVal.textContent = Math.floor(player.speed * 0.22); // px/s → km/h feel

  // Spawn timer
  const spawnRate = Math.max(0.5, 2.2 - player.speed / 400);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = spawnRate * (0.7 + Math.random() * 0.6);
    spawnTraffic();
  }

  // Scroll road elements
  const scroll = player.speed * dt;

  // Dashes
  for (const d of dashes) {
    d.y += scroll;
    if (d.y > H + 40) {
      d.y = -40;
      d.lane = Math.floor(Math.random() * (LANES - 1));
    }
  }

  // Scenery
  for (const s of scenery) {
    s.y += scroll;
    if (s.y > H + 60) {
      const ns = makeScenery(-60);
      s.x = ns.x; s.y = ns.y; s.side = ns.side; s.type = ns.type;
    }
  }

  // Traffic cars
  const relSpeed = player.speed; // player moves "down" relative to traffic
  for (let i = trafficCars.length - 1; i >= 0; i--) {
    const car = trafficCars[i];
    // Traffic moves up at its own speed, but we scroll by player speed
    car.y += (car.speed + relSpeed) * dt;

    // Horn nudge: drift car sideways slowly
    if (car.hornNudgeTimer > 0) {
      car.hornNudgeTimer -= dt;
      const nudgeSpeed = laneWidth() * 0.7; // slow lateral drift
      car.x += car.hornNudge > 0 ? nudgeSpeed * dt : -nudgeSpeed * dt;
      // Clamp to road edges (allow slightly off)
      car.x = Math.max(rl - car.w * 0.2, Math.min(rr + car.w * 0.2, car.x));
    } else if (car.avoiding) {
      // Return toward lane center slowly
      const target = laneX(car.lane);
      car.x += (target - car.x) * Math.min(1, dt * 1.2);
      if (Math.abs(car.x - target) < 2) { car.x = target; car.avoiding = false; }
    }

    // Remove off-screen (scrolled past bottom)
    if (car.y > H + car.h + 20) {
      trafficCars.splice(i, 1);
      continue;
    }

    // Collision detection with player
    if (player.alive && rectsOverlap(
      player.x, player.y, player.w * 0.85, player.h * 0.9,
      car.x, car.y, car.w * 0.85, car.h * 0.9
    )) {
      // Crash!
      player.alive = false;
      spawnParticles(player.x, player.y);
      playCollision();
      setTimeout(() => {
        showGameOver();
      }, 1200);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt; // gravity
    p.life -= dt * 1.4;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ─── Render ───────────────────────────────────────────────
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Sky / background
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#1a1a2e');
  sky.addColorStop(1, '#16213e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  const rl = roadLeft(), rr = roadRight(), rw = roadWidth();

  // Roadside (grass)
  ctx.fillStyle = '#1e3a1e';
  ctx.fillRect(0, 0, rl, H);
  ctx.fillRect(rr, 0, W - rr, H);

  // Curbs
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(rl - 6, 0, 6, H);
  ctx.fillRect(rr, 0, 6, H);

  // Road surface
  const road = ctx.createLinearGradient(rl, 0, rr, 0);
  road.addColorStop(0, '#2a2a2a');
  road.addColorStop(0.5, '#333');
  road.addColorStop(1, '#2a2a2a');
  ctx.fillStyle = road;
  ctx.fillRect(rl, 0, rw, H);

  // Lane dashes
  ctx.save();
  ctx.setLineDash([32, 28]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#666';
  for (let l = 1; l < LANES; l++) {
    const x = roadLeft() + laneWidth() * l;
    ctx.beginPath();
    ctx.moveTo(x, -50);
    ctx.lineTo(x, H + 50);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Scenery
  for (const s of scenery) {
    if (s.type === 'tree') drawTree(ctx, s.x, s.y);
    else drawPole(ctx, s.x, s.y);
  }

  // Traffic cars
  for (const car of trafficCars) {
    drawCar(ctx, car.x, car.y, car.w, car.h, car.color, false, car.speed);
  }

  // Player car (only draw if alive or in death animation)
  if (player.alive || particles.length > 0) {
    if (player.alive) {
      drawCar(ctx, player.x, player.y, player.w, player.h, ['#1e90ff', '#0055cc'], true, player.speed);
    }
  }

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Speed lines when fast
  if (player.speed > 200 && player.alive) {
    const intensity = (player.speed - 200) / (player.maxSpeed - 200);
    ctx.save();
    ctx.globalAlpha = intensity * 0.18;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 12; i++) {
      const sx = rl + Math.random() * rw;
      const sy = Math.random() * H;
      const len = 30 + intensity * 80;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, sy + len);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Horn cooldown ring on button
  renderHornHUD();
}

function renderHornHUD() {
  // Cooldown shown by button dimming (CSS handles press, JS handles cooldown opacity)
  const pct = hornCooldown / HORN_COOLDOWN;
  if (pct > 0) {
    hornBtn.style.opacity = String(0.4 + (1 - pct) * 0.6);
  } else {
    hornBtn.style.opacity = '1';
  }
}

// ─── Game loop ────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (state === 'playing') {
    update(dt);
    render();
  }
  raf = requestAnimationFrame(loop);
}

// ─── Game over ────────────────────────────────────────────
function showGameOver() {
  state = 'dead';
  if (score > highScore) highScore = score;
  finalScore.style.display = 'block';
  finalScore.textContent = `Score: ${Math.floor(score)}  ·  Best: ${Math.floor(highScore)}`;
  startBtn.textContent = 'PLAY AGAIN';
  overlay.style.display = 'flex';
}

// ─── Start ────────────────────────────────────────────────
function startGame() {
  overlay.style.display = 'none';
  state = 'playing';
  initGame();
  // Show hint briefly
  accelIndicator.classList.add('show');
  setTimeout(() => accelIndicator.classList.remove('show'), 2500);
}

startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });

// ─── Touch input ──────────────────────────────────────────
const BOTTOM_ZONE_FRAC = 0.35; // bottom 35% = accel zone

function isAccelZone(y) {
  return y > canvas.height * (1 - BOTTOM_ZONE_FRAC);
}

canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
canvas.addEventListener('touchcancel',onTouchEnd,   { passive: false });

// Horn button
hornBtn.addEventListener('touchstart', (e) => {
  e.stopPropagation();
  e.preventDefault();
  if (state === 'playing') triggerHorn();
}, { passive: false });
hornBtn.addEventListener('mousedown', (e) => {
  e.stopPropagation();
  if (state === 'playing') triggerHorn();
});

function onTouchStart(e) {
  e.preventDefault();
  if (state !== 'playing') return;
  // Find a touch in the accel zone that isn't on the horn button
  for (const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el === hornBtn || hornBtn.contains(el)) continue;
    if (!touch.active) {
      touch.active = true;
      touch.id = t.identifier;
      touch.startX = t.clientX;
      touch.startY = t.clientY;
      touch.currentX = t.clientX;
      touch.currentY = t.clientY;
    }
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.identifier === touch.id) {
      touch.currentX = t.clientX;
      touch.currentY = t.clientY;
    }
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.id) {
      touch.active = false;
      touch.id = null;
    }
  }
}

// Mouse fallback for desktop testing
let mouseDown = false;
let mouseStartX = 0;
canvas.addEventListener('mousedown', (e) => {
  if (state !== 'playing') return;
  mouseDown = true;
  touch.active = true;
  touch.id = 'mouse';
  touch.startX = e.clientX;
  touch.startY = e.clientY;
  touch.currentX = e.clientX;
  touch.currentY = e.clientY;
});
canvas.addEventListener('mousemove', (e) => {
  if (!mouseDown || state !== 'playing') return;
  touch.currentX = e.clientX;
  touch.currentY = e.clientY;
});
canvas.addEventListener('mouseup', () => {
  mouseDown = false;
  touch.active = false;
  touch.id = null;
});
canvas.addEventListener('mouseleave', () => {
  mouseDown = false;
  touch.active = false;
  touch.id = null;
});
// Keyboard fallback
const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key] = true; });
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
  if (e.key === 'h' || e.key === 'H') { if (state === 'playing') triggerHorn(); }
});

function applyKeyboard() {
  if (state !== 'playing') return;
  const accel = keys['ArrowUp'] || keys['w'] || keys[' '];
  if (accel && !touch.active) {
    touch.active = true;
    touch.id = 'key';
    touch.startX = canvas.width / 2;
    touch.currentX = canvas.width / 2;
    if (keys['ArrowLeft'] || keys['a']) touch.currentX = touch.startX - 60;
    if (keys['ArrowRight'] || keys['d']) touch.currentX = touch.startX + 60;
  } else if (!accel && touch.id === 'key') {
    touch.active = false;
    touch.id = null;
  } else if (touch.id === 'key') {
    touch.startX = canvas.width / 2;
    touch.currentX = canvas.width / 2;
    if (keys['ArrowLeft'] || keys['a']) touch.currentX = touch.startX - 60;
    if (keys['ArrowRight'] || keys['d']) touch.currentX = touch.startX + 60;
  }
}

// ─── Kickoff ──────────────────────────────────────────────
lastTime = performance.now();
raf = requestAnimationFrame((ts) => {
  lastTime = ts;
  // Render idle road behind menu
  render();
  raf = requestAnimationFrame(loop);
});

// Patch loop to also apply keyboard
const _loop = loop;
function loop(ts) {
  applyKeyboard();
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (state === 'playing') {
    update(dt);
    render();
  } else {
    // Still render scenery on menu
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, '#1a1a2e');
    sky.addColorStop(1, '#16213e');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const rl = roadLeft(), rr = roadRight(), rw = roadWidth();
    ctx.fillStyle = '#1e3a1e';
    ctx.fillRect(0, 0, rl, canvas.height);
    ctx.fillRect(rr, 0, canvas.width - rr, canvas.height);
    ctx.fillStyle = '#333';
    ctx.fillRect(rl, 0, rw, canvas.height);
  }
  raf = requestAnimationFrame(loop);
}
cancelAnimationFrame(raf);
raf = requestAnimationFrame(loop);
</script>
